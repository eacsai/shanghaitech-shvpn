name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'
          check-latest: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify toolchain
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          test "$(go version)" = "go version go1.25.6 darwin/arm64"
      - name: Run source, privacy, fixture, patch, and build gates
        env:
          SHVPN_RUN_UPSTREAM: '1'
        run: /bin/zsh tests/test.zsh

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            machine: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
            machine: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'
          check-latest: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh openssh-client lsof netcat-openbsd
          curl --fail --location --retry 2 \
            "https://dl.google.com/linux/direct/google-chrome-stable_current_${{ matrix.arch }}.deb" \
            --output "$RUNNER_TEMP/google-chrome.deb"
          sudo apt-get install -y --reinstall "$RUNNER_TEMP/google-chrome.deb"
      - name: Verify Linux toolchain
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = '${{ matrix.machine }}'
          test "$(go version)" = 'go version go1.25.6 linux/${{ matrix.arch }}'
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable)"
          stat -Lc 'Chrome owner=%u mode=%a' "$chrome_path"
          python3 -I -B - "$chrome_path" <<'PY'
          import os, pathlib, stat, sys
          binary = pathlib.Path(sys.argv[1]).resolve(strict=True)
          info = binary.stat()
          assert binary.is_file() and os.access(binary, os.X_OK)
          assert info.st_uid in (0, os.getuid())
          assert not (stat.S_IMODE(info.st_mode) & 0o002)
          print(f"Chrome resolved={binary} owner={info.st_uid} mode={stat.S_IMODE(info.st_mode):o}")
          PY
      - name: Prepare owned Python for isolated installer fixtures
        run: |
          id -u
          stat -Lc 'original Python owner=%u mode=%a' "$(command -v python3)"
          if python3 -I -B -m pip --version; then
            echo "original isolated pip is available"
          else
            echo "original isolated pip exit status: $?"
          fi
          python3 -m venv --copies "$RUNNER_TEMP/shvpn-ci-python"
          chmod go-w "$RUNNER_TEMP/shvpn-ci-python/bin"/python*
          "$RUNNER_TEMP/shvpn-ci-python/bin/python3" -I -B - <<'PY'
          import os, pathlib, stat, sys
          binary = pathlib.Path(sys.executable).resolve()
          info = binary.stat()
          assert info.st_uid in (0, os.getuid())
          assert not (stat.S_IMODE(info.st_mode) & 0o022)
          print(f"fixture Python owner={info.st_uid} mode={stat.S_IMODE(info.st_mode):o}")
          PY
          mkdir -m 700 "$RUNNER_TEMP/python-probe-home"
          HOME="$RUNNER_TEMP/python-probe-home" \
            "$RUNNER_TEMP/shvpn-ci-python/bin/python3" -I -B -m pip --version
          echo "$RUNNER_TEMP/shvpn-ci-python/bin" >> "$GITHUB_PATH"
      - name: Run Linux installation integration gates
        run: /usr/bin/zsh tests/test_linux.zsh
      - name: Verify the real pinned login runtime and bundled driver
        run: |
          /usr/bin/zsh libexec/build-login-runtime.zsh "$(command -v python3)" \
            requirements-login.txt "$RUNNER_TEMP/login-packages"
          python3 -I -B - "$RUNNER_TEMP/login-packages" <<'PY'
          import sys
          sys.path.insert(0, sys.argv[1])
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              assert playwright.chromium.name == "chromium"
          PY
      - name: Build and execute the pinned native Linux client
        run: |
          /usr/bin/zsh libexec/build-client.zsh "$RUNNER_TEMP/zju-connect"
          test "$("$RUNNER_TEMP/zju-connect" -version)" = "ZJU Connect v1.2.2-shanghaitech-nodefix1"
